name: supply-chain-forensics
version: "1.0.0"
description: >
  An environment where an agent investigates a project's dependency graph
  to find supply chain attacks. The scenarios are inspired by real incidents
  like the XZ Utils backdoor (2024) and the Axios npm compromise (2026).

author: "Deshan Gautam, Jai Sharma, Tanmay Angarkar"
license: MIT

tasks:
  - id: easy
    name: Typosquat Detection
    description: >
      A JavaScript fintech project includes a package that looks similar
      to a well-known library but has a slightly different name. One of the
      dependencies runs a suspicious postinstall script.
    max_steps: 12
    difficulty: easy
    score_range: [0.0, 1.0]

  - id: medium
    name: Hijacked Maintainer Account
    description: >
      A Python package with a long update history suddenly changed behavior.
      The latest version appears to be compromised after a maintainer account
      takeover. The malicious code only runs in CI environments.
    max_steps: 20
    difficulty: medium
    score_range: [0.0, 1.0]

  - id: hard
    name: Transitive Dependency Poisoning
    description: >
      A malicious package is hidden several layers deep in a dependency tree
      of a Next.js project. Basic audit tools do not report anything. The
      payload triggers in CI and attempts to read credentials.
    max_steps: 30
    difficulty: hard
    score_range: [0.0, 1.0]

  - id: confusion
    name: Dependency Confusion
    description: >
      A public package shares the same name as an expected internal dependency
      and gets installed instead. It executes unexpected behavior during install.
    max_steps: 20
    difficulty: medium
    score_range: [0.0, 1.0]

observation_space:
  type: dict
  properties:
    step: {type: integer, description: "Current step"}
    action_taken: {type: string, description: "Last action"}
    result: {type: object, description: "Result of the action"}
    packages_flagged: {type: array, items: {type: string}, description: "Flagged packages"}
    steps_remaining: {type: integer, description: "Remaining steps"}
    last_action_error: {type: string, nullable: true}

action_space:
  type: dict
  properties:
    action:
      type: string
      enum:
        - list_packages
        - get_audit_output
        - get_git_log
        - inspect_package
        - check_publish_history
        - check_maintainer
        - trace_network
        - check_similarity
        - get_dependency_tree
        - submit_findings
    params:
      type: object

reward:
  description: >
    Each step has a small penalty (-0.02).
    Final score is based on F1 score, plus a small bonus for correct attack
    classification and fewer steps used.
  range: [-0.02, 1.0]

endpoints:
  reset: POST /reset
  step: POST /step
  state: GET /state/{session_id}
  health: GET /health

runtime:
  language: python
  version: "3.11"
  framework: fastapi

evaluation:
  method: "programmatic + LLM"
  metrics:
    - precision: "Correctly flagged malicious packages"
    - recall: "All malicious packages found"
    - attack_vector_accuracy: "Correct attack type"
  automated_grading: true
  llm_judge_criteria:
    - "Realism of scenarios"
    - "Clarity of signals"
    - "Progression across tasks"

metadata:
  real_world_references:
    - "ua-parser-js hijack (2021)"
    - "event-stream malicious dependency (2018)"
    - "SolarWinds supply chain attack (2020)"
  unique_features:
    - "No hardcoded answers, pattern-based reasoning"
    - "Red herrings in harder tasks"
    - "Deep dependency chains"
    - "CI-triggered behavior"
